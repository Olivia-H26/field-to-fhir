<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field to FHIR | EMS Outcome Feedback</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns%3D'http://www.w3.org/2000/svg' viewBox%3D'0 0 120 120'%3E%3Crect x%3D'1.5' y%3D'1.5' width%3D'117' height%3D'117' rx%3D'26' fill%3D'%23fff' stroke%3D'%2393c5fd' stroke-width%3D'3'/%3E%3Cpath d%3D'M12 64h16l7-16 10 32 8-22 6 6h7' fill%3D'none' stroke%3D'%23ea580c' stroke-width%3D'6' stroke-linecap%3D'round' stroke-linejoin%3D'round'/%3E%3Cpath d%3D'M73 64c16 0 28-9 28-22s-12-20-25-20-23 9-23 19' fill%3D'none' stroke%3D'%232563eb' stroke-width%3D'6' stroke-linecap%3D'round'/%3E%3Cpath d%3D'M46 36l7 7 7-7' fill%3D'none' stroke%3D'%232563eb' stroke-width%3D'6' stroke-linecap%3D'round' stroke-linejoin%3D'round'/%3E%3Ctext x%3D'60' y%3D'104' text-anchor%3D'middle' fill%3D'%231e3a8a' font-family%3D'system-ui,sans-serif' font-size%3D'14' font-weight%3D'600'%3EField to FHIR%3C/text%3E%3C/svg%3E" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@3.0.1/bundle/fhir-client.js"></script>
  <script src="./js/smart-config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; color: #1f2937; background: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; }
    .hero { background: #0f3d63; color: #fff; padding: 2.5rem 1.25rem 2rem; }
    .hero .in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1rem; }
    .hero img { width: 360px; height: 360px; max-width: 80vw; max-height: 80vw; border-radius: 74px; box-shadow: 0 8px 28px rgba(0,0,0,.28); flex: none; }
    .wrap { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem; display: flex; flex-direction: column; justify-content: center; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 1.6rem 1.8rem; text-align: center; }
    .purpose { font-size: 1.2rem; line-height: 1.6; margin: 0; }
    .cta { text-align: center; margin-top: 1.6rem; }
    .cta p { margin: .45rem 0; }
    #signin { font-size: 1.15rem; padding: .9rem 2.6rem; border-radius: 10px; border: 0; background: #2563eb; color: #fff; cursor: pointer; font-weight: 600; }
    #signin:hover { background: #1d4ed8; }
    #signin:disabled { opacity: .6; cursor: wait; }
    #error { color: #b91c1c; }
    @media (max-width: 700px) { .hero img { width: 65vw; height: 65vw; border-radius: 13vw; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="in">
    <img src="data:image/svg+xml,%3Csvg xmlns%3D'http://www.w3.org/2000/svg' viewBox%3D'0 0 120 120'%3E%3Crect x%3D'1.5' y%3D'1.5' width%3D'117' height%3D'117' rx%3D'26' fill%3D'%23fff' stroke%3D'%2393c5fd' stroke-width%3D'3'/%3E%3Cpath d%3D'M12 64h16l7-16 10 32 8-22 6 6h7' fill%3D'none' stroke%3D'%23ea580c' stroke-width%3D'6' stroke-linecap%3D'round' stroke-linejoin%3D'round'/%3E%3Cpath d%3D'M73 64c16 0 28-9 28-22s-12-20-25-20-23 9-23 19' fill%3D'none' stroke%3D'%232563eb' stroke-width%3D'6' stroke-linecap%3D'round'/%3E%3Cpath d%3D'M46 36l7 7 7-7' fill%3D'none' stroke%3D'%232563eb' stroke-width%3D'6' stroke-linecap%3D'round' stroke-linejoin%3D'round'/%3E%3Ctext x%3D'60' y%3D'104' text-anchor%3D'middle' fill%3D'%231e3a8a' font-family%3D'system-ui,sans-serif' font-size%3D'14' font-weight%3D'600'%3EField to FHIR%3C/text%3E%3C/svg%3E" alt="Field to FHIR badge">
    </div>
  </section>

  <div class="wrap">
    <div class="card">
      <p class="purpose">Field to FHIR helps EMS professionals see what happened to their patients by bringing together the EMS crew's field impression and vital signs with the hospital discharge diagnosis or disposition.</p>
    </div>

    <div class="cta">
      <button id="signin" type="button">Sign in</button>
      <p id="error" role="alert" hidden></p>
    </div>
  </div>

  <script>
    "use strict";
    // Dashboard sign-in: SMART App Launch 2.2.0, standalone provider launch, read and search only.
    const CLIENT_ID = "my_web_app";
    const REDIRECT_URI = new URL("index.html", window.location.href).href;
    const SCOPES = [
      "openid",
      "fhirUser",
      "user/Organization.rs",
      "user/Practitioner.rs",
      "user/PractitionerRole.rs",
      "user/Patient.rs",
      "user/Encounter.rs",
      "user/Condition.rs",
      "user/Observation.rs"
    ].join(" ");

    // Only these sign-in servers are trusted. The fhirclient library would otherwise accept any
    // server named in the address bar (?iss=...), so the app checks the address first.
    //  1. The SMART Health IT sandbox (normal use).
    //  2. Inferno's simulated SMART server, used only to test this app with the
    //     SMART App Launch STU2.2 Client test suite (launch.html?iss=<that address>).
    const TRUSTED_ISSUERS = [
      window.EMS_SMART_ISSUER,
      "https://inferno.healthit.gov/suites/custom/smart_client_stu2_2/fhir"
    ];
    function chooseIssuer() {
      const q = new URLSearchParams(window.location.search);
      for (const name of ["launch", "fhirServiceUrl", "clientId", "patientId"]) {
        if (q.has(name)) throw new Error("This page does not accept the \"" + name + "\" setting in its address.");
      }
      const asked = q.get("iss");
      if (asked === null) return window.EMS_SMART_ISSUER;
      if (TRUSTED_ISSUERS.includes(asked)) return asked;
      throw new Error("This sign-in server is not on the app's trusted list: " + asked);
    }

    function start() {
      const btn = document.getElementById("signin");
      const err = document.getElementById("error");
      err.hidden = true;
      let issuer;
      try { issuer = chooseIssuer(); }
      catch (e) { err.hidden = false; err.textContent = "Sign-in stopped: " + e.message; return; }
      btn.disabled = true;
      btn.textContent = "Opening sign-in…";
      FHIR.oauth2.authorize({
        clientId: CLIENT_ID,
        scope: SCOPES,
        redirectUri: REDIRECT_URI,
        iss: issuer,
        pkceMode: "required"
      }).catch(e => {
        btn.disabled = false;
        btn.textContent = "Sign in";
        err.hidden = false;
        err.textContent = "Sign-in could not start: " + (e && e.message ? e.message : String(e));
      });
    }
    document.getElementById("signin").addEventListener("click", start);
  </script>
</body>
</html>
